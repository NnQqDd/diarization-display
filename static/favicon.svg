    <rect x="5"  y="13" width="3" height="6"  rx="1.5"/>
    <rect x="10" y="8"  width="3" height="16" rx="1.5"/>
    <rect x="15" y="4"  width="3" height="24" rx="1.5" fill="#d29922"/>
    <rect x="20" y="10" width="3" height="12" rx="1.5"/>
    <rect x="25" y="14" width="3" height="4"  rx="1.5"/>
  </g>
</svg>
